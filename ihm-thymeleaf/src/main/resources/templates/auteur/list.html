<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>Liste des auteurs</title>
</head>
<body>
<main>
    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Liste des auteurs</h1>
            <a class="btn btn-primary" th:href="@{/auteurs/create}">Ajouter un auteur</a>
        </div>

        <p class="text-muted" th:if="${#lists.isEmpty(auteurs)}">
            Aucun auteur enregistré pour le moment.
        </p>

        <table class="table table-striped align-middle" th:unless="${#lists.isEmpty(auteurs)}">
            <thead>
            <tr>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Nationalité</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="auteur : ${auteurs}">
                <td th:text="${auteur.nom}">Nom</td>
                <td th:text="${auteur.prenom}">Prénom</td>
                <td th:text="${auteur.nationalite}">Nationalité</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/auteurs/{id}(id=${auteur.id})}">Voir</a>
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/auteurs/{id}/edit(id=${auteur.id})}">Modifier</a>
                    <form th:action="@{/auteurs/{id}/delete(id=${auteur.id})}" method="post"
                          class="d-inline"
                          onsubmit="return confirm('Supprimer cet auteur ?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

    </div>
</main>
</body>
</html>
